<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛剑模拟面试考试记录 - VISION ACADEMY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root { --blue:#2159b7; --navy:#293b59; --bg:#eff1f5; --line:#dce1eb; --text:#344054; --muted:#7c8598; }
        * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); font-family:"Microsoft YaHei",sans-serif; }
        .app { display:flex; min-height:100vh; }.sidebar { width:230px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); }.sidebar-logo { height:104px; display:flex; align-items:center; gap:14px; padding:22px 28px; border-bottom:1px solid #eef1f5; }.logo-mark { width:46px; height:46px; display:grid; place-items:center; border:2px solid var(--blue); border-radius:50%; color:var(--blue); font-weight:900; font-size:21px; }.logo-text { color:var(--blue); font-size:14px; font-weight:800; line-height:1.25; }.sidebar-menu { padding:42px 12px 18px; }.menu-item { display:flex; align-items:center; gap:14px; margin-bottom:12px; padding:16px; border-radius:12px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:700; }.menu-item:hover { background:#f6f8fc; color:var(--text); }.menu-item.active { background:#e8edf6; color:#3466d6; }
        .main { min-width:0; flex:1; display:flex; flex-direction:column; }.header { height:56px; display:flex; align-items:center; justify-content:flex-end; gap:18px; padding:0 28px; background:#fff; border-bottom:1px solid var(--line); }.exam-select { height:38px; min-width:140px; padding:0 16px; border:1px solid #cfd7e6; border-radius:999px; background:#fff; color:var(--text); font-size:14px; font-weight:700; }.user-info,.logout { color:var(--text); font-size:14px; font-weight:600; }.logout { color:#3466d6; text-decoration:none; font-weight:700; }.content { flex:1; padding:12px 28px 28px; }.page-top { display:flex; align-items:center; gap:18px; height:50px; margin:0 -28px 22px; padding:0 18px; background:#fff; border:1px solid var(--line); border-left:0; border-right:0; }.back { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px; border:1px solid #d4dae8; border-radius:999px; background:#fff; color:#667085; text-decoration:none; font-size:14px; font-weight:700; }.page-title { margin:0; color:#1d2939; font-size:19px; font-weight:900; }.record-card { max-width:680px; padding:24px; border:1px solid #dde3ec; border-radius:18px; background:#fff; box-shadow:0 1px 0 rgba(16,24,40,.02); }.record-head { display:flex; justify-content:space-between; gap:20px; margin-bottom:20px; }.record-title { margin:0; color:#344054; font-size:23px; font-weight:900; }.record-sub { margin-top:8px; color:#667085; font-size:14px; }.score { min-width:92px; overflow:hidden; border:1px solid #d9e5e9; border-radius:16px; text-align:center; }.score strong { display:block; padding:13px 6px 9px; background:#e6f5f8; color:#2b88b2; font-size:25px; font-style:italic; }.score span { display:block; padding:8px 6px; color:#475467; font-size:12px; font-weight:700; }.meta-list { display:grid; gap:12px; }.meta { display:flex; align-items:center; gap:8px; color:#98a2b3; font-size:13px; font-weight:600; }.meta i { width:16px; text-align:center; }.meta strong { margin-left:8px; color:#475467; font-size:14px; }.status { display:inline-flex; padding:4px 8px; border-radius:99px; background:#ecfdf3; color:#067647; font-size:12px; font-weight:800; }.detail-btn { width:100%; height:40px; margin-top:22px; border:2px solid #d8deea; border-radius:999px; background:#fff; color:#344054; font-size:14px; font-weight:800; }.detail-btn:hover { border-color:#bfd0f7; color:var(--blue); }
        @media(max-width:900px){.sidebar{display:none}.content{padding:12px 16px 22px}.page-top{margin:0 -16px 20px;padding:0 16px}} @media(max-width:520px){.record-head{flex-direction:column}.header{padding:0 16px;gap:10px}.exam-select{min-width:0;width:130px}.user-info{display:none}}
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar"><div class="sidebar-logo"><div class="logo-mark">A</div><div class="logo-text">VISION ACADEMY<br>唯寻国际教育</div></div><nav class="sidebar-menu"><a class="menu-item" href="牛剑模拟面试首页.html"><i class="fa fa-home"></i><span>考试首页</span></a><a class="menu-item active" href="牛剑模拟面试考试记录.html"><i class="fa fa-file-text-o"></i><span>考试记录</span></a><a class="menu-item" href="考试入口.html"><i class="fa fa-th-large"></i><span>考试类型</span></a><a class="menu-item" href="#"><i class="fa fa-user-o"></i><span>个人中心</span></a></nav></aside>
        <main class="main"><header class="header"><select class="exam-select"><option>牛剑模拟面试</option></select><div class="user-info">Hi，王一博</div><a class="logout" id="logoutBtn" href="index.html">退出登录</a></header><div class="content"><div class="page-top"><a class="back" href="考试入口.html"><i class="fa fa-angle-left"></i> 返回</a><h1 class="page-title">考试记录</h1></div><section class="record-card"><div class="record-head"><div><h2 class="record-title" id="recordName">牛剑模拟面试</h2><div class="record-sub">面试录音与作答过程已完成模拟解析</div></div><div class="score"><strong>优秀</strong><span>面试表现</span></div></div><div class="meta-list"><div class="meta"><i class="fa fa-calendar"></i> 面试日期 <strong id="recordDate"></strong></div><div class="meta"><i class="fa fa-university"></i> 目标院校 <strong id="recordUniversity">University of Cambridge</strong></div><div class="meta"><i class="fa fa-book"></i> 目标专业 <strong id="recordMajor">Economics (L100)</strong></div><div class="meta"><i class="fa fa-clock-o"></i> 录制时长 <strong id="recordDuration">08:36</strong></div><div class="meta"><i class="fa fa-check-circle-o"></i> 状态 <span class="status" id="recordStatus">已完成</span></div></div><button class="detail-btn" id="detailBtn" type="button">查看详情 <i class="fa fa-angle-right"></i></button></section></div></main>
    </div>
    <script>
        (function() { var loginKey='examPlatformLoggedIn'; if (localStorage.getItem(loginKey)!=='true') { window.location.href='index.html'; return; } var record={examName:'牛剑模拟面试',date:'2026/09/23',duration:'08:36',university:'University of Cambridge',major:'Economics (L100)',status:'已完成'}; try { record=Object.assign(record,JSON.parse(sessionStorage.getItem('oxbridgeInterviewRecord'))||{}); } catch(e) {} document.getElementById('recordName').textContent=record.examName; document.getElementById('recordDate').textContent=record.date; document.getElementById('recordDuration').textContent=record.duration; document.getElementById('recordUniversity').textContent=record.university; document.getElementById('recordMajor').textContent=record.major; document.getElementById('recordStatus').textContent=record.status; document.getElementById('detailBtn').onclick=function(){window.location.href='牛剑模拟面试成绩报告.html';}; document.getElementById('logoutBtn').onclick=function(e){e.preventDefault();localStorage.removeItem(loginKey);localStorage.removeItem('examPlatformUserName');window.location.href='index.html';}; })();
    </script>
</body>
<script>
    document.querySelectorAll('.menu-item[href="考试入口.html"]').forEach(function(item) { item.remove(); });
    var backButton = document.querySelector('.page-top .back');
    if (backButton) backButton.href = '牛剑模拟面试首页.html';
</script>
</html>
