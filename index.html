<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯寻线上考试平台 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --primary: #1a7fc4;
            --primary-dark: #0e5ca8;
            --text: #30384f;
            --muted: #7d879b;
            --line: #e4ebf4;
            --bg: #f3f6fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 52px 28px;
        }

        .login-shell {
            width: min(1180px, 100%);
            min-height: 520px;
            display: grid;
            grid-template-columns: 440px minmax(0, 1fr);
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(216, 225, 237, 0.9);
            border-radius: 28px;
            box-shadow: 0 28px 80px rgba(28, 45, 72, 0.08);
        }

        .brand-mosaic {
            display: grid;
            grid-template-columns: 118px 1fr 132px;
            grid-template-rows: 122px 122px 1fr;
            gap: 14px;
            padding-right: 0;
            background: #fff;
        }

        .tile {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.9);
        }

        .tile::after {
            content: "";
            position: absolute;
            right: -35%;
            bottom: -42%;
            width: 120%;
            height: 120%;
            background: rgba(0, 77, 144, 0.12);
            transform: rotate(40deg);
        }

        .tile i,
        .tile .mark {
            position: relative;
            z-index: 1;
        }

        .tile-small-a {
            background: #c9f4f8;
            color: #2b78bc;
        }

        .tile-small-b {
            grid-column: 1;
            grid-row: 2;
            background: #67bad8;
            color: #1571b6;
        }

        .tile-large {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
            background: var(--primary);
            font-size: 76px;
        }

        .tile-mid-a {
            grid-column: 1;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #58acec;
            color: #166db5;
        }

        .tile-mid-b {
            grid-column: 2;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #d2f7fb;
            color: #175fa8;
        }

        .tile-mid-c {
            grid-column: 3;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #8ed9ee;
            color: #276eb5;
        }

        .tile-bottom {
            grid-column: 1 / 4;
            grid-row: 3;
            align-self: end;
            height: calc(100% - 136px);
            min-height: 240px;
            background: var(--primary-dark);
            font-size: 112px;
        }

        .tile .mark {
            width: 66px;
            height: 50px;
            border: 5px solid currentColor;
            border-top: none;
            transform: skew(-12deg);
        }

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 64px;
        }

        .login-box {
            width: min(470px, 100%);
        }

        .welcome {
            margin: 0 0 12px;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            color: #626b80;
        }

        .title {
            margin: 0 0 46px;
            text-align: center;
            font-size: 40px;
            line-height: 1.2;
            font-weight: 800;
            color: #30384f;
            letter-spacing: 0;
        }

        .login-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            margin-bottom: 36px;
            padding: 5px;
            border-radius: 30px;
            background: #f0f4f9;
        }

        .login-tab {
            height: 50px;
            border: none;
            border-radius: 26px;
            background: transparent;
            color: #7b8496;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .login-tab.active {
            color: #30384f;
            background: #fff;
            box-shadow: 0 6px 18px rgba(32, 51, 80, 0.06);
        }

        .form-field {
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            height: 62px;
            border: 2px solid var(--line);
            border-radius: 32px;
            padding: 0 28px;
            color: #30384f;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder {
            color: #b7c1d0;
        }

        .login-input:focus {
            border-color: #9fcef4;
            box-shadow: 0 0 0 5px rgba(26, 127, 196, 0.08);
        }

        .login-error {
            min-height: 22px;
            margin: -6px 0 16px;
            padding-left: 24px;
            color: #d92d20;
            font-size: 14px;
        }

        .login-submit {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 34px;
            background: #aeb9ca;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .login-submit:hover {
            background: #8fa0b8;
            transform: translateY(-1px);
        }

        @media (max-width: 900px) {
            .login-shell {
                grid-template-columns: 1fr;
                max-width: 560px;
            }

            .brand-mosaic {
                display: none;
            }

            .login-panel {
                padding: 44px 28px;
            }

            .title {
                font-size: 32px;
                margin-bottom: 34px;
            }
        }

        @media (max-width: 520px) {
            .login-page {
                padding: 22px 14px;
            }

            .login-shell {
                border-radius: 20px;
            }

            .login-panel {
                padding: 34px 18px;
            }

            .welcome {
                font-size: 19px;
            }

            .title {
                font-size: 28px;
            }

            .login-tab {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-shell" aria-label="唯寻线上考试平台登录">
            <div class="brand-mosaic" aria-hidden="true">
                <div class="tile tile-small-a"><i class="fa fa-flask fa-3x"></i></div>
                <div class="tile tile-small-b"><i class="fa fa-cogs fa-3x"></i></div>
                <div class="tile tile-large"><i class="fa fa-jpy"></i></div>
                <div class="tile tile-mid-a"><i class="fa fa-share-alt fa-3x"></i></div>
                <div class="tile tile-mid-b"><span class="mark"></span></div>
                <div class="tile tile-mid-c"><i class="fa fa-pencil-square-o fa-3x"></i></div>
                <div class="tile tile-bottom"><i class="fa fa-pencil"></i></div>
            </div>

            <div class="login-panel">
                <div class="login-box">
                    <p class="welcome">欢迎参加👋</p>
                    <h1 class="title">唯寻线上考试平台</h1>

                    <div class="login-tabs" role="tablist" aria-label="登录方式">
                        <button class="login-tab active" type="button" data-mode="ticket">准考证登录</button>
                        <button class="login-tab" type="button" data-mode="phone">手机登录</button>
                        <button class="login-tab" type="button" data-mode="account">学习账号登录</button>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="form-field">
                            <input id="primaryInput" class="login-input" type="text" autocomplete="off" placeholder="请输入报考人姓名">
                        </div>
                        <div class="form-field">
                            <input id="secondaryInput" class="login-input" type="text" autocomplete="off" placeholder="请输入准考证号">
                        </div>
                        <div id="loginError" class="login-error"></div>
                        <button class="login-submit" type="submit">登 录</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function() {
            var loginKey = 'examPlatformLoggedIn';
            var userKey = 'examPlatformUserName';
            var modeConfig = {
                ticket: {
                    primary: '请输入报考人姓名',
                    secondary: '请输入准考证号',
                    secondaryType: 'text'
                },
                phone: {
                    primary: '请输入手机号',
                    secondary: '请输入验证码',
                    secondaryType: 'text'
                },
                account: {
                    primary: '请输入学习账号',
                    secondary: '请输入密码',
                    secondaryType: 'password'
                }
            };

            var tabs = document.querySelectorAll('.login-tab');
            var primaryInput = document.getElementById('primaryInput');
            var secondaryInput = document.getElementById('secondaryInput');
            var loginError = document.getElementById('loginError');
            var activeMode = 'ticket';

            function setMode(mode) {
                activeMode = mode;
                tabs.forEach(function(tab) {
                    tab.classList.toggle('active', tab.dataset.mode === mode);
                });
                primaryInput.value = '';
                secondaryInput.value = '';
                primaryInput.placeholder = modeConfig[mode].primary;
                secondaryInput.placeholder = modeConfig[mode].secondary;
                secondaryInput.type = modeConfig[mode].secondaryType;
                loginError.textContent = '';
                primaryInput.focus();
            }

            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    setMode(tab.dataset.mode);
                });
            });

            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();

                var primary = primaryInput.value.trim();
                var secondary = secondaryInput.value.trim();

                if (!primary || !secondary) {
                    loginError.textContent = '请完整填写登录信息。';
                    (!primary ? primaryInput : secondaryInput).focus();
                    return;
                }

                sessionStorage.setItem(loginKey, 'true');
                sessionStorage.setItem(userKey, activeMode === 'ticket' ? primary : '王一博');
                window.location.href = '考试入口.html';
            });

            primaryInput.focus();
        })();
    </script>
</body>
</html>
