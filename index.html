<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯寻线上考试平台 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1a7fc4;
            --primary-dark: #0e5ca8;
            --text: #30384f;
            --muted: #7d879b;
            --line: #e4ebf4;
            --bg: #f3f6fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 52px 28px;
        }

        .login-shell {
            width: min(1180px, 100%);
            min-height: 520px;
            display: grid;
            grid-template-columns: 440px minmax(0, 1fr);
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(216, 225, 237, 0.9);
            border-radius: 28px;
            box-shadow: 0 28px 80px rgba(28, 45, 72, 0.08);
        }

        .brand-mosaic {
            display: grid;
            grid-template-columns: 118px 1fr 132px;
            grid-template-rows: 122px 122px 1fr;
            gap: 14px;
            padding-right: 0;
            background: #fff;
        }

        .tile {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.9);
        }

        .tile::after {
            content: "";
            position: absolute;
            right: -35%;
            bottom: -42%;
            width: 120%;
            height: 120%;
            background: rgba(0, 77, 144, 0.12);
            transform: rotate(40deg);
        }

        .tile i,
        .tile .mark {
            position: relative;
            z-index: 1;
        }

        .tile-small-a {
            background: #c9f4f8;
            color: #2b78bc;
        }

        .tile-small-b {
            grid-column: 1;
            grid-row: 2;
            background: #67bad8;
            color: #1571b6;
        }

        .tile-large {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
            background: var(--primary);
            font-size: 76px;
        }

        .tile-mid-a {
            grid-column: 1;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #58acec;
            color: #166db5;
        }

        .tile-mid-b {
            grid-column: 2;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #d2f7fb;
            color: #175fa8;
        }

        .tile-mid-c {
            grid-column: 3;
            grid-row: 3;
            align-self: start;
            height: 122px;
            background: #8ed9ee;
            color: #276eb5;
        }

        .tile-bottom {
            grid-column: 1 / 4;
            grid-row: 3;
            align-self: end;
            height: calc(100% - 136px);
            min-height: 240px;
            background: var(--primary-dark);
            font-size: 112px;
        }

        .tile .mark {
            width: 66px;
            height: 50px;
            border: 5px solid currentColor;
            border-top: none;
            transform: skew(-12deg);
        }

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 64px;
        }

        .login-box {
            width: min(470px, 100%);
        }

        .portal-switch {
            display: inline-flex;
            gap: 4px;
            margin: 0 0 28px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #f7f9fc;
        }

        .portal-switch-wrap {
            text-align: right;
        }

        .portal-switch-btn {
            height: 34px;
            padding: 0 13px;
            border: 0;
            border-radius: 18px;
            background: transparent;
            color: #7b8496;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .portal-switch-btn.active {
            background: #fff;
            color: var(--primary-dark);
            box-shadow: 0 3px 10px rgba(32, 51, 80, 0.08);
        }

        .registration-view[hidden],
        .login-view[hidden] {
            display: none;
        }

        .registration-heading {
            margin: 0 0 8px;
            text-align: center;
            color: var(--text);
            font-size: 30px;
            font-weight: 800;
        }

        .registration-copy {
            margin: 0 0 26px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        .registration-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .registration-card {
            min-height: 142px;
            padding: 18px;
            border: 1px solid var(--line);
            border-top: 4px solid var(--accent, var(--primary));
            border-radius: 10px;
            background: #fff;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .registration-card:hover,
        .registration-card:focus-visible {
            border-color: #9dc6ec;
            box-shadow: 0 10px 22px rgba(28, 73, 123, 0.1);
            outline: none;
            transform: translateY(-2px);
        }

        .registration-card i {
            color: var(--accent, var(--primary));
            font-size: 22px;
        }

        .registration-card strong {
            display: block;
            margin: 13px 0 7px;
            color: var(--text);
            font-size: 16px;
        }

        .registration-card span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .registration-modal {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(23, 35, 55, 0.46);
        }

        .registration-modal[hidden] {
            display: none;
        }

        .registration-dialog {
            position: relative;
            width: min(386px, 100%);
            padding: 30px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(17, 29, 49, 0.24);
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: #f3f6fa;
            color: #61708a;
            font-size: 18px;
            cursor: pointer;
        }

        .registration-dialog h2 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 22px;
        }

        .registration-dialog p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .registration-qrcode {
            display: grid;
            width: 196px;
            height: 196px;
            place-items: center;
            margin: 24px auto 18px;
            border: 1px solid #e0e8f3;
            border-radius: 10px;
            background: #fff;
        }

        .registration-qrcode img,
        .registration-qrcode canvas {
            max-width: 172px;
            max-height: 172px;
        }

        .registration-note {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #f5f8fd;
            color: #61708a;
            font-size: 12px;
        }

        .welcome {
            margin: 0 0 12px;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            color: #626b80;
        }

        .title {
            margin: 0 0 46px;
            text-align: center;
            font-size: 40px;
            line-height: 1.2;
            font-weight: 800;
            color: #30384f;
            letter-spacing: 0;
        }

        .login-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            margin-bottom: 36px;
            padding: 5px;
            border-radius: 30px;
            background: #f0f4f9;
        }

        .login-tab {
            height: 50px;
            border: none;
            border-radius: 26px;
            background: transparent;
            color: #7b8496;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .login-tab.active {
            color: #30384f;
            background: #fff;
            box-shadow: 0 6px 18px rgba(32, 51, 80, 0.06);
        }

        .form-field {
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            height: 62px;
            border: 2px solid var(--line);
            border-radius: 32px;
            padding: 0 28px;
            color: #30384f;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input::placeholder {
            color: #b7c1d0;
        }

        .login-input:focus {
            border-color: #9fcef4;
            box-shadow: 0 0 0 5px rgba(26, 127, 196, 0.08);
        }

        .login-error {
            min-height: 22px;
            margin: -6px 0 16px;
            padding-left: 24px;
            color: #d92d20;
            font-size: 14px;
        }

        .login-submit {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 34px;
            background: #aeb9ca;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .login-submit:hover {
            background: #8fa0b8;
            transform: translateY(-1px);
        }

        @media (max-width: 900px) {
            .login-shell {
                grid-template-columns: 1fr;
                max-width: 560px;
            }

            .brand-mosaic {
                display: none;
            }

            .login-panel {
                padding: 44px 28px;
            }

            .registration-grid {
                gap: 10px;
            }

            .title {
                font-size: 32px;
                margin-bottom: 34px;
            }
        }

        @media (max-width: 520px) {
            .login-page {
                padding: 22px 14px;
            }

            .login-shell {
                border-radius: 20px;
            }

            .login-panel {
                padding: 34px 18px;
            }

            .welcome {
                font-size: 19px;
            }

            .title {
                font-size: 28px;
            }

            .login-tab {
                font-size: 13px;
            }

            .registration-card {
                min-height: 126px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-shell" aria-label="唯寻线上考试平台登录">
            <div class="brand-mosaic" aria-hidden="true">
                <div class="tile tile-small-a"><i class="fa fa-flask fa-3x"></i></div>
                <div class="tile tile-small-b"><i class="fa fa-cogs fa-3x"></i></div>
                <div class="tile tile-large"><i class="fa fa-jpy"></i></div>
                <div class="tile tile-mid-a"><i class="fa fa-share-alt fa-3x"></i></div>
                <div class="tile tile-mid-b"><span class="mark"></span></div>
                <div class="tile tile-mid-c"><i class="fa fa-pencil-square-o fa-3x"></i></div>
                <div class="tile tile-bottom"><i class="fa fa-pencil"></i></div>
            </div>

            <div class="login-panel">
                <div class="login-box">
                    <div class="portal-switch-wrap"><div class="portal-switch" role="tablist" aria-label="页面切换"><button class="portal-switch-btn active" type="button" data-view="login" role="tab" aria-selected="true">登录</button><button class="portal-switch-btn" type="button" data-view="registration" role="tab" aria-selected="false">报名</button></div></div>

                    <div class="login-view" id="loginView">
                        <p class="welcome">欢迎参加👋</p>
                        <h1 class="title">唯寻线上考试平台</h1>

                        <div class="login-tabs" role="tablist" aria-label="登录方式">
                            <button class="login-tab active" type="button" data-mode="ticket">准考证登录</button>
                            <button class="login-tab" type="button" data-mode="phone">手机登录</button>
                            <button class="login-tab" type="button" data-mode="account">学习账号登录</button>
                        </div>

                        <form id="loginForm" novalidate>
                            <div class="form-field">
                                <input id="primaryInput" class="login-input" type="text" autocomplete="off" placeholder="请输入报考人姓名">
                            </div>
                            <div class="form-field">
                                <input id="secondaryInput" class="login-input" type="text" autocomplete="off" placeholder="请输入准考证号">
                            </div>
                            <div id="loginError" class="login-error"></div>
                            <button class="login-submit" type="submit">登 录</button>
                        </form>
                    </div>

                    <section class="registration-view" id="registrationView" hidden aria-label="考试报名">
                        <h1 class="registration-heading">考试报名</h1>
                        <p class="registration-copy">选择考试类型，扫码完成报名。</p>
                        <div class="registration-grid" id="registrationGrid"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div class="registration-modal" id="registrationModal" hidden role="dialog" aria-modal="true" aria-labelledby="registrationModalTitle">
        <div class="registration-dialog">
            <button class="modal-close" id="modalCloseBtn" type="button" aria-label="关闭报名二维码"><i class="fa fa-times"></i></button>
            <h2 id="registrationModalTitle">考试报名</h2>
            <p>请使用微信扫描二维码，进入对应考试的报名页面。</p>
            <div class="registration-qrcode" id="registrationQrcode" aria-label="报名二维码"></div>
            <div class="registration-note"><i class="fa fa-mobile"></i> 报名信息以扫码页面为准</div>
        </div>
    </div>

    <script>
        (function() {
            var loginKey = 'examPlatformLoggedIn';
            var userKey = 'examPlatformUserName';
            var modeConfig = {
                ticket: {
                    primary: '请输入报考人姓名',
                    secondary: '请输入准考证号',
                    secondaryType: 'text'
                },
                phone: {
                    primary: '请输入手机号',
                    secondary: '请输入验证码',
                    secondaryType: 'text'
                },
                account: {
                    primary: '请输入学习账号',
                    secondary: '请输入密码',
                    secondaryType: 'password'
                }
            };

            var tabs = document.querySelectorAll('.login-tab');
            var primaryInput = document.getElementById('primaryInput');
            var secondaryInput = document.getElementById('secondaryInput');
            var loginError = document.getElementById('loginError');
            var activeMode = 'ticket';
            var activeView = 'login';
            var loginView = document.getElementById('loginView');
            var registrationView = document.getElementById('registrationView');
            var portalButtons = document.querySelectorAll('.portal-switch-btn');
            var registrationModal = document.getElementById('registrationModal');
            var registrationQrcode = document.getElementById('registrationQrcode');
            var registrationModalTitle = document.getElementById('registrationModalTitle');
            var lastFocusedElement = null;
            var registrationExams = [
                { id:'g5-written', name:'牛剑G5笔试模考', description:'牛剑G5笔试全真模拟', icon:'fa-graduation-cap', accent:'#4b8ff0', registrationUrl:'vision-exam://registration?exam=g5-written' },
                { id:'g5-interview', name:'牛剑模拟面试', description:'牛津剑桥申请面试全真模拟', icon:'fa-comments-o', accent:'#6c68e9', registrationUrl:'vision-exam://registration?exam=g5-interview' },
                { id:'ielts', name:'雅思考试', description:'雅思全真模考评测', icon:'fa-language', accent:'#35b995', registrationUrl:'vision-exam://registration?exam=ielts' },
                { id:'amc', name:'AMC竞赛模考', description:'AMC竞赛全真模拟', icon:'fa-line-chart', accent:'#ef9b47', registrationUrl:'vision-exam://registration?exam=amc' }
            ];

            function setMode(mode) {
                activeMode = mode;
                tabs.forEach(function(tab) {
                    tab.classList.toggle('active', tab.dataset.mode === mode);
                });
                primaryInput.value = '';
                secondaryInput.value = '';
                primaryInput.placeholder = modeConfig[mode].primary;
                secondaryInput.placeholder = modeConfig[mode].secondary;
                secondaryInput.type = modeConfig[mode].secondaryType;
                loginError.textContent = '';
                primaryInput.focus();
            }

            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    setMode(tab.dataset.mode);
                });
            });

            function renderRegistrationExams() {
                document.getElementById('registrationGrid').innerHTML = registrationExams.map(function(exam) {
                    return '<button class="registration-card" type="button" data-exam-id="' + exam.id + '" style="--accent:' + exam.accent + '"><i class="fa ' + exam.icon + '"></i><strong>' + exam.name + '</strong><span>' + exam.description + '</span></button>';
                }).join('');
                document.querySelectorAll('.registration-card').forEach(function(card) {
                    card.addEventListener('click', function() {
                        openRegistrationModal(registrationExams.filter(function(exam) { return exam.id === card.dataset.examId; })[0]);
                    });
                });
            }

            function setView(view) {
                activeView = view;
                var isLogin = view === 'login';
                loginView.hidden = !isLogin;
                registrationView.hidden = isLogin;
                portalButtons.forEach(function(button) {
                    var selected = button.dataset.view === view;
                    button.classList.toggle('active', selected);
                    button.setAttribute('aria-selected', String(selected));
                });
                if (isLogin) {
                    primaryInput.focus();
                } else {
                    registrationView.querySelector('.registration-card').focus();
                }
            }

            function openRegistrationModal(exam) {
                if (!exam) return;
                lastFocusedElement = document.activeElement;
                registrationModalTitle.textContent = exam.name + '报名';
                registrationQrcode.innerHTML = '';
                if (window.QRCode) {
                    new QRCode(registrationQrcode, { text:exam.registrationUrl, width:172, height:172, colorDark:'#233b61', colorLight:'#ffffff' });
                } else {
                    registrationQrcode.textContent = '报名二维码暂不可用';
                }
                registrationModal.hidden = false;
                document.getElementById('modalCloseBtn').focus();
            }

            function closeRegistrationModal() {
                registrationModal.hidden = true;
                registrationQrcode.innerHTML = '';
                if (lastFocusedElement) lastFocusedElement.focus();
            }

            portalButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    setView(button.dataset.view);
                });
            });

            document.getElementById('modalCloseBtn').addEventListener('click', closeRegistrationModal);
            registrationModal.addEventListener('click', function(event) {
                if (event.target === registrationModal) closeRegistrationModal();
            });
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && !registrationModal.hidden) closeRegistrationModal();
            });

            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();

                var primary = primaryInput.value.trim();
                var secondary = secondaryInput.value.trim();

                if (!primary || !secondary) {
                    loginError.textContent = '请完整填写登录信息。';
                    (!primary ? primaryInput : secondaryInput).focus();
                    return;
                }

                sessionStorage.setItem(loginKey, 'true');
                sessionStorage.setItem(userKey, activeMode === 'ticket' ? primary : '王一博');
                window.location.href = '考试入口.html';
            });

            renderRegistrationExams();
            primaryInput.focus();
        })();
    </script>
</body>
</html>
