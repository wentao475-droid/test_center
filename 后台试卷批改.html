<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试卷批改 - VISION ACADEMY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --sidebar-width: 80px;
            --header-height: 58px;
            --sidebar-bg: #172b63;
            --sidebar-active: #2b6fff;
            --page-bg: #f4f6fb;
            --card-border: #e9edf5;
            --text-main: #1f2d3d;
            --text-sub: #667085;
            --accent: #2b6fff;
            --success: #52c41a;
            --warning: #ff9f1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background: var(--page-bg);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1d336f 0%, #15275a 100%);
            color: rgba(255, 255, 255, 0.74);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 0;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            text-align: center;
            line-height: 1.35;
            font-weight: 700;
        }

        .nav-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .nav-item {
            width: 100%;
            padding: 12px 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.4;
            cursor: default;
        }

        .nav-item i {
            display: block;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .nav-item.active {
            background: rgba(43, 111, 255, 0.2);
            color: #fff;
            position: relative;
        }

        .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 3px;
            border-radius: 999px;
            background: #5b8cff;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #344054;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: #667085;
        }

        .page-body {
            padding: 18px;
        }

        .breadcrumb-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .back-link {
            color: #475467;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-lite,
        .btn-green,
        .btn-blue {
            height: 34px;
            min-width: 90px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            padding: 0 14px;
            border: 1px solid transparent;
        }

        .btn-lite {
            background: #fff;
            border-color: #d9dee8;
            color: #475467;
        }

        .btn-green {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        .btn-blue {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .mark-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 16px;
            align-items: start;
        }

        .content-card,
        .panel-card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
        }

        .content-card {
            padding: 16px;
        }

        .panel-card {
            padding: 14px;
            position: sticky;
            top: 18px;
        }

        .meta-row {
            font-size: 13px;
            color: #667085;
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-toolbar {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .control-label {
            font-size: 12px;
            color: #667085;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .mode-btn {
            border: 1px solid #d9dee8;
            background: #fff;
            color: #475467;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 14px;
        }

        .mode-btn.active {
            border-color: var(--accent);
            background: rgba(43, 111, 255, 0.08);
            color: var(--accent);
        }

        .paper-tabs {
            display: flex;
            gap: 28px;
            border-bottom: 1px solid #edf1f6;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .paper-tab {
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: #667085;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .paper-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .question-card {
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .question-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .question-title {
            font-size: 16px;
            font-weight: 800;
            color: #344054;
        }

        .question-index {
            font-size: 12px;
            color: #667085;
            font-weight: 700;
        }

        .question-prompt {
            font-size: 13px;
            line-height: 1.8;
            color: #475467;
            margin-bottom: 10px;
        }

        .cue-list {
            margin: 0 0 10px 18px;
            color: #667085;
            font-size: 13px;
            line-height: 1.7;
        }

        .answer-block {
            border-radius: 8px;
            background: #fafbfc;
            border: 1px solid #edf1f5;
            padding: 12px;
            margin-bottom: 12px;
        }

        .answer-label {
            font-size: 12px;
            color: #667085;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .audio-mock {
            width: 100%;
            margin-bottom: 10px;
        }

        .answer-text {
            font-size: 13px;
            line-height: 1.8;
            color: #344054;
            margin-bottom: 8px;
        }

        .mark-inline-panel {
            border-top: 1px dashed #e4e9f1;
            padding-top: 12px;
            display: block;
        }

        .mark-status {
            font-size: 12px;
            color: #98a2b3;
            margin-top: 6px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: #344054;
            margin-bottom: 12px;
        }

        .panel-block {
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fcfdff;
        }

        .panel-note {
            font-size: 12px;
            line-height: 1.7;
            color: #667085;
        }

        .submit-tip {
            font-size: 12px;
            color: #98a2b3;
            line-height: 1.7;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        textarea.form-control {
            min-height: 112px;
            resize: vertical;
        }

        @media (max-width: 1100px) {
            .mark-layout {
                grid-template-columns: 1fr;
            }

            .panel-card {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-between;
                padding: 12px 14px;
            }

            .nav-list {
                flex-direction: row;
                overflow-x: auto;
                margin-top: 0;
            }

            .nav-item {
                min-width: 72px;
            }

            .header {
                padding: 0 14px;
            }

            .page-body {
                padding: 14px;
            }

            .breadcrumb-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .score-toolbar,
            .mark-inline-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">VISION<br>ACADEMY</div>
            <div class="nav-list">
                <div class="nav-item"><i class="fa fa-book"></i>课程</div>
                <div class="nav-item"><i class="fa fa-file-text-o"></i>班级</div>
                <div class="nav-item active"><i class="fa fa-graduation-cap"></i>学管</div>
                <div class="nav-item"><i class="fa fa-user-circle-o"></i>作业</div>
                <div class="nav-item"><i class="fa fa-bar-chart"></i>报表</div>
            </div>
        </aside>

        <main class="main">
            <header class="header">
                <div class="header-title">
                    <i class="fa fa-refresh"></i>
                    <span>教学工作台</span>
                </div>
                <div class="header-user">
                    <span><i class="fa fa-user-circle-o"></i> 王一博老师</span>
                    <span>退出</span>
                </div>
            </header>

            <div class="page-body">
                <div class="breadcrumb-row">
                    <a class="back-link" id="backLink" href="#"><i class="fa fa-angle-left"></i> 返回 | 查看答题卡</a>
                    <div class="action-group">
                        <button type="button" class="btn-lite" id="cancelBtn">取消</button>
                        <button type="button" class="btn-green" id="saveBtn">保存</button>
                        <button type="button" class="btn-blue" id="submitBtn">提交最终成绩</button>
                    </div>
                </div>

                <div class="mark-layout">
                    <section class="content-card">
                        <div class="meta-row" id="metaRow"></div>
                        <div class="score-toolbar">
                            <div>
                                <div class="control-label">总评分</div>
                                <select class="form-select form-select-sm" id="overallScore"></select>
                            </div>
                            <div>
                                <div class="control-label">综合评价</div>
                                <input type="text" class="form-control form-control-sm" id="overallSummary" placeholder="请输入整体评价摘要">
                            </div>
                        </div>

                        <div class="paper-tabs" id="paperTabs"></div>
                        <div id="questionList"></div>
                    </section>

                    <aside class="panel-card" id="markPanel">
                        <div class="panel-title">批改操作面板</div>

                        <div class="mode-switch">
                            <button type="button" class="mode-btn active" data-mode="per-question">单题批改</button>
                            <button type="button" class="mode-btn" data-mode="batch">批量批改</button>
                        </div>

                        <div class="panel-block">
                            <div class="control-label">当前试卷分数</div>
                            <select class="form-select form-select-sm" id="panelScore"></select>
                        </div>

                        <div class="panel-block" id="batchPanel">
                            <div class="control-label">批量评语</div>
                            <textarea class="form-control form-control-sm" id="batchComment" placeholder="输入统一评语后，可一键应用到所有题目"></textarea>
                            <button type="button" class="btn-blue mt-3 w-100" id="applyBatchBtn">应用到全部题目</button>
                        </div>

                        <!-- <div class="panel-block">
                            <div class="control-label">保存说明</div>
                            <div class="panel-note">页面支持实时草稿保存。评分、评语和批量设置发生变化时会自动写入本地草稿，重新进入页面后会自动恢复。</div>
                        </div> -->

                        
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/paper_review_data.js"></script>
    <script>
        (function () {
            function getQuery(name) {
                return new URLSearchParams(window.location.search).get(name);
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            var paperId = getQuery("paperId") || "NUMK2026131629";
            var studentId = getQuery("studentId") || "STU20260601001";
            var candidateId = getQuery("candidateId") || paperId;
            var paper = window.paperReviewStore.getPaper(paperId);
            var draftKey = "paperReviewDraft:" + paperId + ":" + studentId;
            var finalKey = "paperReviewFinal:" + paperId + ":" + studentId;
            var autoSaveTimer = null;

            function normalizeScore(value, fallback) {
                var parsed = parseFloat(value);
                if (Number.isNaN(parsed)) {
                    return fallback || "0.0";
                }
                return parsed.toFixed(1);
            }

            var defaultReviewComment = "发音自然，内容组织较完整，后续可进一步提升论证深度。";
            var state = {
                mode: "per-question",
                overallScore: normalizeScore(paper.totalScore, "9.0"),
                panelScore: normalizeScore(paper.totalScore, "9.0"),
                reviewComment: defaultReviewComment,
                batchComment: "",
                questionMarks: {}
            };

            var metaRow = document.getElementById("metaRow");
            var overallScore = document.getElementById("overallScore");
            var overallSummary = document.getElementById("overallSummary");
            var panelScore = document.getElementById("panelScore");
            var batchComment = document.getElementById("batchComment");
            var questionList = document.getElementById("questionList");
            var paperTabs = document.getElementById("paperTabs");
            var saveBtn = document.getElementById("saveBtn");
            var submitBtn = document.getElementById("submitBtn");
            var cancelBtn = document.getElementById("cancelBtn");
            var applyBatchBtn = document.getElementById("applyBatchBtn");
            var batchPanel = document.getElementById("batchPanel");
            var backLink = document.getElementById("backLink");
            var modeButtons = Array.prototype.slice.call(document.querySelectorAll(".mode-btn"));

            function initQuestionState() {
                paper.questions.forEach(function (question) {
                    state.questionMarks[question.id] = {
                        comment: question.comment
                    };
                });
            }

            function applyDraft(draft) {
                if (!draft) {
                    return;
                }
                state.mode = draft.mode || state.mode;
                state.overallScore = normalizeScore(draft.overallScore, state.overallScore);
                state.panelScore = normalizeScore(draft.panelScore, state.panelScore);
                state.reviewComment = draft.reviewComment || draft.overallSummary || draft.finalComment || state.reviewComment;
                state.batchComment = draft.batchComment || state.batchComment;
                if (draft.questionMarks) {
                    Object.keys(draft.questionMarks).forEach(function (questionId) {
                        if (state.questionMarks[questionId]) {
                            state.questionMarks[questionId] = {
                                comment: draft.questionMarks[questionId].comment || state.questionMarks[questionId].comment
                            };
                        }
                    });
                }
            }

            function loadDraft() {
                initQuestionState();
                try {
                    var cached = window.localStorage.getItem(draftKey);
                    if (cached) {
                        applyDraft(JSON.parse(cached));
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            function setDraftStatus(text, iconClass) {
                return;
            }

            function saveDraft() {
                var payload = {
                    overallScore: normalizeScore(state.overallScore, "0.0"),
                    panelScore: normalizeScore(state.panelScore, "0.0"),
                    reviewComment: state.reviewComment,
                    questionMarks: Object.keys(state.questionMarks).reduce(function (result, questionId) {
                        result[questionId] = {
                            comment: state.questionMarks[questionId].comment
                        };
                        return result;
                    }, {})
                };
                window.localStorage.setItem(draftKey, JSON.stringify(payload));
                setDraftStatus("草稿已保存 " + new Date().toLocaleString("zh-CN", { hour12: false }), "fa-check-circle");
            }

            function scheduleAutoSave() {
                setDraftStatus("草稿保存中...", "fa-spinner");
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(saveDraft, 300);
            }

            function renderMeta() {
                metaRow.innerHTML = [
                    "考试名称：" + paper.examName,
                    "学生姓名：" + paper.studentName,
                    "准考证号：" + candidateId
                ].map(function (item) {
                    return "<span>" + item + "</span>";
                }).join("");
            }

            function renderTabs() {
                paperTabs.innerHTML = paper.tabs.map(function (tab) {
                    return '<div class="paper-tab' + (tab === paper.activeTab ? ' active' : '') + '">' + tab + '</div>';
                }).join("");
            }

            function renderScoreOptions() {
                var options = paper.scoreOptions.map(function (item) {
                    return '<option value="' + item + '">' + item + '</option>';
                }).join("");
                overallScore.innerHTML = options;
                panelScore.innerHTML = options;
                overallScore.value = normalizeScore(state.overallScore, "0.0");
                panelScore.value = normalizeScore(state.panelScore, "0.0");
            }

            function syncHeaderFields() {
                overallSummary.value = state.reviewComment;
                batchComment.value = state.batchComment;
                overallScore.value = normalizeScore(state.overallScore, "0.0");
                panelScore.value = normalizeScore(state.panelScore, "0.0");
            }

            function renderQuestionList() {
                questionList.innerHTML = paper.questions.map(function (question, index) {
                    var cues = question.cuePoints.length
                        ? '<ul class="cue-list">' + question.cuePoints.map(function (item) {
                            return "<li>" + escapeHtml(item) + "</li>";
                        }).join("") + "</ul>"
                        : "";
                    var questionState = state.questionMarks[question.id];

                    return [
                        '<div class="question-card">',
                        '<div class="question-head">',
                        '<div class="question-title">' + escapeHtml(question.title) + '</div>',
                        '<div class="question-index">题目 ' + (index + 1) + '</div>',
                        '</div>',
                        '<div class="question-prompt">' + escapeHtml(question.prompt) + '</div>',
                        cues,
                        '<div class="answer-block">',
                        '<div class="answer-label">' + escapeHtml(question.answerLabel) + '</div>',
                        '<audio class="audio-mock" controls></audio>',
                        '<div class="answer-text">' + escapeHtml(question.transcript) + '</div>',
                        '</div>',
                        '<div class="mark-inline-panel">',
                        '<div>',
                        '<div class="control-label">本题评语</div>',
                        '<textarea class="form-control form-control-sm question-comment" data-question-id="' + question.id + '" placeholder="请输入本题批改评语">' + escapeHtml(questionState.comment) + '</textarea>',
                        '<div class="mark-status">' + escapeHtml(question.tags.join(" / ")) + '</div>',
                        '</div>',
                        '</div>',
                        '</div>'
                    ].join("");
                }).join("");
            }

            function updateModeView() {
                modeButtons.forEach(function (button) {
                    button.classList.toggle("active", button.getAttribute("data-mode") === state.mode);
                });
                batchPanel.classList.toggle("hidden", state.mode !== "batch");
            }

            function bindQuestionEvents() {
                Array.prototype.forEach.call(document.querySelectorAll(".question-comment"), function (textarea) {
                    textarea.addEventListener("input", function () {
                        var questionId = this.getAttribute("data-question-id");
                        state.questionMarks[questionId].comment = this.value;
                        scheduleAutoSave();
                    });
                });
            }

            function bindStaticEvents() {
                overallScore.addEventListener("change", function () {
                    state.overallScore = normalizeScore(this.value, state.overallScore);
                    panelScore.value = state.overallScore;
                    state.panelScore = state.overallScore;
                    scheduleAutoSave();
                });

                panelScore.addEventListener("change", function () {
                    state.panelScore = normalizeScore(this.value, state.panelScore);
                    overallScore.value = state.panelScore;
                    state.overallScore = state.panelScore;
                    scheduleAutoSave();
                });

                overallSummary.addEventListener("input", function () {
                    state.reviewComment = this.value;
                    scheduleAutoSave();
                });

                batchComment.addEventListener("input", function () {
                    state.batchComment = this.value;
                    scheduleAutoSave();
                });

                modeButtons.forEach(function (button) {
                    button.addEventListener("click", function () {
                        state.mode = this.getAttribute("data-mode");
                        updateModeView();
                        scheduleAutoSave();
                    });
                });

                applyBatchBtn.addEventListener("click", function () {
                    paper.questions.forEach(function (question) {
                        state.questionMarks[question.id].comment = state.batchComment || state.questionMarks[question.id].comment;
                    });
                    renderQuestionList();
                    bindQuestionEvents();
                    scheduleAutoSave();
                });

                saveBtn.addEventListener("click", function () {
                    saveDraft();
                    alert("批改草稿已保存。");
                });

                submitBtn.addEventListener("click", function () {
                    saveDraft();
                    window.localStorage.setItem(finalKey, JSON.stringify({
                        overallScore: normalizeScore(state.overallScore, "0.0"),
                        panelScore: normalizeScore(state.panelScore, "0.0"),
                        reviewComment: state.reviewComment,
                        questionMarks: Object.keys(state.questionMarks).reduce(function (result, questionId) {
                            result[questionId] = {
                                comment: state.questionMarks[questionId].comment
                            };
                            return result;
                        }, {})
                    }));
                    alert("最终成绩已提交。");
                });

                cancelBtn.addEventListener("click", function () {
                    window.location.href = backLink.href;
                });

                window.addEventListener("beforeunload", function () {
                    saveDraft();
                });
            }

            function initBackLink() {
                var params = new URLSearchParams({
                    paperId: paper.paperId,
                    studentId: studentId,
                    candidateId: candidateId
                });
                backLink.href = "后台试卷查看.html?" + params.toString();
            }

            loadDraft();
            initBackLink();
            renderMeta();
            renderTabs();
            renderScoreOptions();
            syncHeaderFields();
            renderQuestionList();
            updateModeView();
            bindQuestionEvents();
            bindStaticEvents();
            
        })();
    </script>
</body>
</html>
