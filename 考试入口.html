<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯寻考试平台 - 考试入口</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --brand: #155da5;
            --brand-dark: #123f7a;
            --text: #31384f;
            --muted: #7a8497;
            --line: #e1e8f2;
            --bg: #f3f6fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            background: #fff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--brand);
            font-weight: 800;
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            border: 4px solid var(--brand);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            line-height: 1;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.08;
        }

        .brand-en {
            font-size: 19px;
            letter-spacing: 0.5px;
        }

        .brand-cn {
            margin-top: 4px;
            font-size: 14px;
            letter-spacing: 6px;
        }

        .logout {
            border: none;
            border-radius: 18px;
            padding: 8px 18px;
            background: #f0f5ff;
            color: var(--brand);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .page {
            min-height: calc(100vh - 88px);
            padding: 88px 5.5vw 72px;
        }

        .hero {
            text-align: center;
            margin-bottom: 54px;
        }

        .hero h1 {
            margin: 0 0 18px;
            font-size: 44px;
            line-height: 1.2;
            font-weight: 800;
            color: #30384f;
            letter-spacing: 0;
        }

        .hero p {
            margin: 0;
            font-size: 23px;
            color: #748094;
        }

        .exam-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(220px, 1fr));
            gap: 26px;
            align-items: stretch;
        }

        .exam-card {
            min-height: 336px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 48px 52px 34px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 18px 42px rgba(34, 54, 86, 0.04);
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .exam-card:hover {
            transform: translateY(-3px);
            border-color: #c8d9f2;
            box-shadow: 0 24px 54px rgba(34, 54, 86, 0.08);
        }

        .exam-card.available {
            color: var(--brand);
        }

        .exam-card.is-disabled {
            cursor: default;
        }

        .exam-title {
            margin: 0 0 18px;
            font-size: 31px;
            line-height: 1.2;
            font-weight: 800;
            color: #30384f;
            letter-spacing: 0;
        }

        .available .exam-title {
            color: #1a5db4;
        }

        .exam-desc {
            margin: 0;
            font-size: 18px;
            color: #788396;
            font-weight: 600;
        }

        .enter-icon {
            position: absolute;
            top: 44px;
            right: 40px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf3ff;
            color: #1a5db4;
            font-size: 26px;
        }

        .card-art {
            flex: 1;
            min-height: 150px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding-top: 28px;
            font-size: 94px;
            color: #93bdff;
            text-shadow: 0 16px 20px rgba(75, 113, 172, 0.12);
        }

        .trophy {
            color: #ffd45a;
            text-shadow: 0 10px 16px rgba(222, 166, 36, 0.24);
        }

        .english {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 74px;
        }

        .english .badge {
            display: inline-flex;
            width: 72px;
            height: 72px;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #8db8ff;
            color: #fff;
            font-size: 34px;
            font-weight: 800;
            box-shadow: 0 10px 16px rgba(70, 112, 190, 0.16);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 36px;
            transform: translateX(-50%) translateY(18px);
            opacity: 0;
            pointer-events: none;
            padding: 12px 22px;
            border-radius: 24px;
            background: rgba(24, 33, 50, 0.92);
            color: #fff;
            font-size: 15px;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 10;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 1320px) {
            .exam-grid {
                grid-template-columns: repeat(3, minmax(220px, 1fr));
            }
        }

        @media (max-width: 980px) {
            .page {
                padding-top: 58px;
            }

            .exam-grid {
                grid-template-columns: repeat(2, minmax(220px, 1fr));
            }
        }

        @media (max-width: 640px) {
            .topbar {
                height: 76px;
                padding: 0 18px;
            }

            .brand-mark {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }

            .brand-en {
                font-size: 15px;
            }

            .brand-cn {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .page {
                min-height: calc(100vh - 76px);
                padding: 38px 18px 44px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 18px;
            }

            .exam-grid {
                grid-template-columns: 1fr;
            }

            .exam-card {
                min-height: 250px;
                padding: 34px 32px 28px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand" aria-label="Vision Academy 唯寻国际教育">
            <div class="brand-mark">A</div>
            <div class="brand-copy">
                <span class="brand-en">VISION ACADEMY</span>
                <span class="brand-cn">唯寻国际教育</span>
            </div>
        </div>
        <button class="logout" id="logoutBtn" type="button"><i class="fa fa-user-circle-o"></i> 退出登录</button>
    </header>

    <main class="page">
        <section class="hero">
            <h1>唯寻考试平台</h1>
            <p>请选择你要参与的考试类型</p>
        </section>

        <section class="exam-grid" aria-label="考试类型">
            <article class="exam-card is-disabled" data-disabled="true">
                <h2 class="exam-title">唯寻杯</h2>
                <p class="exam-desc">唯寻官方学术能力测试</p>
                <div class="card-art trophy"><i class="fa fa-trophy"></i></div>
            </article>

            <article class="exam-card is-disabled" data-disabled="true">
                <h2 class="exam-title">牛剑G5笔试模考</h2>
                <p class="exam-desc">牛剑G5笔试全真模拟</p>
                <div class="card-art"><i class="fa fa-graduation-cap"></i></div>
            </article>

            <article class="exam-card available" data-target="雅思考试首页.html">
                <span class="enter-icon"><i class="fa fa-arrow-right"></i></span>
                <h2 class="exam-title">雅思考试</h2>
                <p class="exam-desc">雅思全真模考评测</p>
                <div class="card-art english">
                    <i class="fa fa-globe"></i>
                    <span class="badge">En</span>
                </div>
            </article>

            <article class="exam-card is-disabled" data-disabled="true">
                <h2 class="exam-title">前测考试</h2>
                <p class="exam-desc">入学能力前置评测</p>
                <div class="card-art"><i class="fa fa-dashboard"></i></div>
            </article>

            <article class="exam-card is-disabled" data-disabled="true">
                <h2 class="exam-title">ALEVEL模考</h2>
                <p class="exam-desc">ALEVEL全真模拟</p>
                <div class="card-art"><i class="fa fa-check-square-o"></i></div>
            </article>
        </section>
    </main>

    <div class="toast" id="toast">该考试暂未开放</div>

    <script>
        (function() {
            var loginKey = 'examPlatformLoggedIn';

            if (sessionStorage.getItem(loginKey) !== 'true') {
                window.location.href = 'index.html';
                return;
            }

            var toast = document.getElementById('toast');
            var toastTimer = null;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 1800);
            }

            document.querySelectorAll('.exam-card').forEach(function(card) {
                card.addEventListener('click', function() {
                    var target = card.dataset.target;

                    if (target) {
                        window.location.href = target;
                        return;
                    }

                    showToast('该考试暂未开放');
                });
            });

            document.getElementById('logoutBtn').addEventListener('click', function() {
                sessionStorage.removeItem(loginKey);
                sessionStorage.removeItem('examPlatformUserName');
                window.location.href = 'index.html';
            });
        })();
    </script>
</body>
</html>
