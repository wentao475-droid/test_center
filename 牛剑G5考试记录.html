<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛剑G5模考考试记录 - VISION ACADEMY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #eff1f5;
            color: #344054;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: #fff;
            border-right: 1px solid #dce1eb;
            flex-shrink: 0;
        }

        .sidebar-logo {
            height: 104px;
            padding: 22px 28px;
            border-bottom: 1px solid #eef1f5;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-mark {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #2159b7;
            color: #2159b7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: 700;
        }

        .logo-text {
            color: #2159b7;
            font-weight: 800;
            line-height: 1.2;
            font-size: 14px;
        }

        .sidebar-menu {
            padding: 42px 12px 18px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #7c8598;
            text-decoration: none;
            border-radius: 12px;
            padding: 16px 16px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .menu-item.active {
            background: #e8edf6;
            color: #3466d6;
        }

        .menu-item:hover {
            background: #f6f8fc;
            color: #344054;
        }

        .main-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 56px;
            background: #fff;
            border-bottom: 1px solid #dce1eb;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 18px;
            padding: 0 28px;
            flex-shrink: 0;
        }

        .exam-select {
            min-width: 124px;
            height: 38px;
            border-radius: 999px;
            border: 1px solid #cfd7e6;
            padding: 0 38px 0 16px;
            font-size: 14px;
            font-weight: 600;
            color: #344054;
            appearance: none;
            outline: none;
            background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="%23667085" d="M7 10l5 5 5-5z"/></svg>') no-repeat right 12px center;
        }

        .user-info {
            font-size: 14px;
            color: #344054;
            font-weight: 600;
        }

        .logout-btn {
            color: #3466d6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 28px 28px;
        }

        .page-top {
            height: 50px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 18px;
            background: #fff;
            border: 1px solid #dce1eb;
            border-left: none;
            border-right: none;
            margin: 0 -28px 22px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid #d4dae8;
            color: #667085;
            background: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .page-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: #1d2939;
        }

        .month-block {
            margin-bottom: 26px;
        }

        .month-title {
            margin: 0 0 18px;
            font-size: 24px;
            font-weight: 900;
            color: #3e4a61;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .record-card {
            background: #fff;
            border: 1px solid #dde3ec;
            border-radius: 18px;
            padding: 24px 24px 22px;
            box-shadow: 0 1px 0 rgba(16, 24, 40, 0.02);
        }

        .record-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 24px;
        }

        .record-name {
            font-size: 24px;
            font-weight: 900;
            color: #344054;
            margin-bottom: 26px;
        }

        .meta-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #98a2b3;
            font-weight: 600;
        }

        .meta-value {
            color: #475467;
            margin-left: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .score-stack {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .score-pill,
        .score-single {
            width: 88px;
            border: 1px solid #d9e5e9;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            text-align: center;
            flex-shrink: 0;
        }

        .score-pill-top,
        .score-single-top {
            background: #e6f5f8;
            color: #2b88b2;
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            padding: 12px 6px 9px;
            line-height: 1;
        }

        .score-pill-bottom,
        .score-single-bottom {
            padding: 8px 6px 9px;
            font-size: 13px;
            font-weight: 700;
            color: #475467;
            background: #fff;
        }

        .score-caption {
            margin-top: 10px;
            text-align: right;
            font-size: 13px;
            color: #98a2b3;
            font-weight: 700;
        }

        .detail-btn {
            width: 100%;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 999px;
            border: 2px solid #d8deea;
            background: #fff;
            text-decoration: none;
            color: #344054;
            font-size: 14px;
            font-weight: 800;
        }

        .detail-btn:hover {
            color: #2159b7;
            border-color: #bfd0f7;
        }

        @media (max-width: 1100px) {
            .sidebar {
                display: none;
            }
            .record-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 0 16px;
                gap: 12px;
            }
            .content-area {
                padding: 12px 16px 20px;
            }
            .page-top {
                margin: 0 -16px 20px;
                padding: 0 16px;
                flex-wrap: wrap;
                height: auto;
                min-height: 56px;
            }
            .record-head {
                flex-direction: column;
            }
            .score-caption {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-mark">A</div>
                <div class="logo-text">VISION ACADEMY<br>唯寻国际教育</div>
            </div>
            <div class="sidebar-menu">
                <a href="牛剑G5笔试模考.html" class="menu-item"><i class="fa fa-home"></i><span>考试首页</span></a>
                <a href="牛剑G5考试记录.html" class="menu-item active"><i class="fa fa-file-text-o"></i><span>考试记录</span></a>
                <a href="学科考试.html" class="menu-item"><i class="fa fa-th-large"></i><span>真题案例</span></a>
                <a href="#" class="menu-item"><i class="fa fa-user-o"></i><span>个人中心</span></a>
            </div>
        </aside>

        <main class="main-wrapper">
            <header class="header">
                <select class="exam-select">
                    <option>牛剑模考</option>
                </select>
                <div class="user-info">Hi，王一博</div>
                <a href="index.html" class="logout-btn" id="logoutBtn">退出登录</a>
            </header>

            <div class="content-area">
                <div class="page-top">
                    <a href="javascript:history.back()" class="btn-back"><i class="fa fa-angle-left"></i> 返回</a>
                    <h1 class="page-title">考试记录</h1>
                </div>

                <section class="month-block" id="latestBlock" style="display:none;">
                    <h2 class="month-title">最近完成</h2>
                    <div class="record-grid" id="latestGrid"></div>
                </section>

                <section class="month-block">
                    <h2 class="month-title">2026年6月</h2>
                    <div class="record-grid">
                        <article class="record-card">
                            <div class="record-head">
                                <div>
                                    <div class="record-name">TMUA</div>
                                    <div class="meta-list">
                                        <div class="meta-item"><i class="fa fa-calendar-o"></i><span>考试日期</span><span class="meta-value">2026-06-12</span></div>
                                        <div class="meta-item"><i class="fa fa-clock-o"></i><span>考试耗时</span><span class="meta-value">150分钟</span></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="score-single">
                                        <div class="score-single-top">7.5</div>
                                        <div class="score-single-bottom">paper 1+2</div>
                                    </div>
                                    <div class="score-caption">测试得分</div>
                                </div>
                            </div>
                            <a href="牛剑G5成绩分析.html?exam=TMUA" class="detail-btn">查看详情 <i class="fa fa-angle-right"></i></a>
                        </article>

                        <article class="record-card">
                            <div class="record-head">
                                <div>
                                    <div class="record-name">ESAT</div>
                                    <div class="meta-list">
                                        <div class="meta-item"><i class="fa fa-calendar-o"></i><span>考试日期</span><span class="meta-value">2026-06-15</span></div>
                                        <div class="meta-item"><i class="fa fa-clock-o"></i><span>考试耗时</span><span class="meta-value">120分钟</span></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="score-stack">
                                        <div class="score-pill">
                                            <div class="score-pill-top">8.5</div>
                                            <div class="score-pill-bottom">Math1</div>
                                        </div>
                                        <div class="score-pill">
                                            <div class="score-pill-top">7.6</div>
                                            <div class="score-pill-bottom">Math2</div>
                                        </div>
                                        <div class="score-pill">
                                            <div class="score-pill-top">9.0</div>
                                            <div class="score-pill-bottom">Physics</div>
                                        </div>
                                    </div>
                                    <div class="score-caption">测试得分</div>
                                </div>
                            </div>
                            <a href="牛剑G5成绩分析.html?exam=ESAT" class="detail-btn">查看详情 <i class="fa fa-angle-right"></i></a>
                        </article>

                        <article class="record-card">
                            <div class="record-head">
                                <div>
                                    <div class="record-name">TARA</div>
                                    <div class="meta-list">
                                        <div class="meta-item"><i class="fa fa-calendar-o"></i><span>考试日期</span><span class="meta-value">2026-07-30</span></div>
                                        <div class="meta-item"><i class="fa fa-clock-o"></i><span>考试耗时</span><span class="meta-value">120分钟</span></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="score-stack">
                                        <div class="score-pill">
                                            <div class="score-pill-top">7.2</div>
                                            <div class="score-pill-bottom">CT</div>
                                        </div>
                                        <div class="score-pill">
                                            <div class="score-pill-top">5.7</div>
                                            <div class="score-pill-bottom">PS</div>
                                        </div>
                                    </div>
                                    <div class="score-caption">考试得分</div>
                                </div>
                            </div>
                            <a href="牛剑G5成绩分析.html?exam=TARA" class="detail-btn">查看详情 <i class="fa fa-angle-right"></i></a>
                        </article>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        (function() {
            var loginKey = 'examPlatformLoggedIn';
            if (sessionStorage.getItem(loginKey) !== 'true') {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', function(event) {
                event.preventDefault();
                sessionStorage.removeItem(loginKey);
                sessionStorage.removeItem('examPlatformUserName');
                window.location.href = 'index.html';
            });

            var raw = sessionStorage.getItem('g5ExamRecord');
            if (!raw) {
                return;
            }

            var record = JSON.parse(raw);
            var latestBlock = document.getElementById('latestBlock');
            var latestGrid = document.getElementById('latestGrid');
            var completedDate = new Date(record.completedAt || Date.now());
            var dateText = completedDate.getFullYear() + '-' + String(completedDate.getMonth() + 1).padStart(2, '0') + '-' + String(completedDate.getDate()).padStart(2, '0');
            var scoreHtml = (record.scoreItems || []).map(function(item) {
                return [
                    '<div class="score-pill">',
                    '<div class="score-pill-top">' + item.score + '</div>',
                    '<div class="score-pill-bottom">' + item.label + '</div>',
                    '</div>'
                ].join('');
            }).join('');

            if (!scoreHtml) {
                scoreHtml = [
                    '<div class="score-single">',
                    '<div class="score-single-top">' + (record.score || '7.5') + '</div>',
                    '<div class="score-single-bottom">' + ((record.subPapers || ['综合']).join(' / ')) + '</div>',
                    '</div>'
                ].join('');
            }

            latestGrid.innerHTML = [
                '<article class="record-card">',
                '<div class="record-head">',
                '<div>',
                '<div class="record-name">' + (record.examName || '牛剑G5模考') + '</div>',
                '<div class="meta-list">',
                '<div class="meta-item"><i class="fa fa-calendar-o"></i><span>考试日期</span><span class="meta-value">' + dateText + '</span></div>',
                '<div class="meta-item"><i class="fa fa-clock-o"></i><span>考试耗时</span><span class="meta-value">' + (record.durationText || '120分钟') + '</span></div>',
                '</div>',
                '</div>',
                '<div><div class="score-stack">' + scoreHtml + '</div><div class="score-caption">测试得分</div></div>',
                '</div>',
                '<a href="牛剑G5成绩分析.html?exam=' + encodeURIComponent(record.examName || 'G5') + '&latest=1" class="detail-btn">查看详情 <i class="fa fa-angle-right"></i></a>',
                '</article>'
            ].join('');
            latestBlock.style.display = 'block';
        })();
    </script>
</body>
</html>
