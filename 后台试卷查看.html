<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看答题卡 - VISION ACADEMY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --sidebar-width: 80px;
            --header-height: 58px;
            --sidebar-bg: #172b63;
            --sidebar-active: #2b6fff;
            --page-bg: #f4f6fb;
            --card-border: #e9edf5;
            --text-main: #1f2d3d;
            --text-sub: #667085;
            --accent: #2b6fff;
            --success: #52c41a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background: var(--page-bg);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1d336f 0%, #15275a 100%);
            color: rgba(255, 255, 255, 0.74);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 0;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            text-align: center;
            line-height: 1.35;
            font-weight: 700;
        }

        .nav-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .nav-item {
            width: 100%;
            padding: 12px 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.4;
            cursor: default;
            transition: background 0.2s ease;
        }

        .nav-item i {
            display: block;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .nav-item.active {
            background: rgba(43, 111, 255, 0.2);
            color: #fff;
            position: relative;
        }

        .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 3px;
            border-radius: 999px;
            background: #5b8cff;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #344054;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: #667085;
        }

        .page-body {
            padding: 18px 18px 28px;
        }

        .breadcrumb-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .back-link {
            color: #475467;
            font-size: 13px;
            font-weight: 700;
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-lightline,
        .btn-primaryline {
            height: 34px;
            min-width: 90px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            padding: 0 14px;
        }

        .btn-lightline {
            border: 1px solid #d9dee8;
            background: #fff;
            color: #475467;
        }

        .btn-primaryline {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .page-card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 18px;
        }

        .meta-row {
            font-size: 13px;
            color: #667085;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .summary-bar {
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 18px 14px;
            text-align: center;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
        }

        .summary-title {
            font-size: 16px;
            font-weight: 800;
            color: #344054;
        }

        .summary-metrics {
            display: flex;
            justify-content: center;
            gap: 44px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .metric-item {
            text-align: center;
        }

        .metric-value {
            font-size: 26px;
            font-weight: 900;
            color: #233a68;
            line-height: 1.1;
        }

        .metric-label {
            font-size: 12px;
            color: #98a2b3;
            margin-top: 4px;
        }

        .paper-tabs {
            display: flex;
            gap: 28px;
            border-bottom: 1px solid #edf1f6;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .paper-tab {
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: #667085;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .paper-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .question-card {
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 14px 12px;
            margin-bottom: 14px;
            background: #fff;
        }

        .question-title {
            font-size: 16px;
            font-weight: 800;
            color: #344054;
            margin-bottom: 10px;
        }

        .question-prompt {
            font-size: 13px;
            line-height: 1.8;
            color: #475467;
            margin-bottom: 10px;
        }

        .cue-list {
            margin: 0 0 10px 18px;
            color: #667085;
            font-size: 13px;
            line-height: 1.7;
        }

        .answer-block {
            border-radius: 8px;
            background: #fafbfc;
            border: 1px solid #edf1f5;
            padding: 12px;
        }

        .answer-label {
            font-size: 12px;
            color: #667085;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .audio-mock {
            width: 100%;
            margin-bottom: 10px;
        }

        .answer-text {
            font-size: 13px;
            line-height: 1.8;
            color: #344054;
            margin-bottom: 8px;
        }

        .review-comment-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d9e2f0;
        }

        .review-comment-label {
            font-size: 12px;
            color: #667085;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .review-comment-text {
            font-size: 13px;
            line-height: 1.8;
            color: #344054;
        }

        @media (max-width: 992px) {
            .summary-metrics {
                gap: 18px;
            }
        }

        @media (max-width: 768px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-between;
                padding: 12px 14px;
            }

            .nav-list {
                flex-direction: row;
                overflow-x: auto;
                margin-top: 0;
            }

            .nav-item {
                min-width: 72px;
            }

            .header {
                padding: 0 14px;
            }

            .page-body {
                padding: 14px;
            }

            .breadcrumb-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">VISION<br>ACADEMY</div>
            <div class="nav-list">
                <div class="nav-item"><i class="fa fa-book"></i>课程</div>
                <div class="nav-item"><i class="fa fa-file-text-o"></i>班级</div>
                <div class="nav-item active"><i class="fa fa-graduation-cap"></i>学管</div>
                <div class="nav-item"><i class="fa fa-user-circle-o"></i>作业</div>
                <div class="nav-item"><i class="fa fa-bar-chart"></i>报表</div>
            </div>
        </aside>

        <main class="main">
            <header class="header">
                <div class="header-title">
                    <i class="fa fa-refresh"></i>
                    <span>教学工作台</span>
                </div>
                <div class="header-user">
                    <span><i class="fa fa-user-circle-o"></i> 王一博老师</span>
                    <span>退出</span>
                </div>
            </header>

            <div class="page-body">
                <div class="breadcrumb-row">
                    <div class="back-link"><i class="fa fa-angle-left"></i> 返回 | 查看答题卡</div>
                    <div class="action-group">
                        <button type="button" class="btn-lightline" id="downloadBtn">下载全部答题卡</button>
                        <button type="button" class="btn-primaryline" id="markBtn">批改</button>
                    </div>
                </div>

                <section class="page-card">
                    <div class="meta-row" id="metaRow"></div>
                    <div class="paper-tabs" id="paperTabs"></div>
                    <div class="summary-bar">
                        <div class="summary-title">Speaking Analysis</div>
                        <div class="summary-metrics">
                            <div class="metric-item">
                                <div class="metric-value" id="totalScore">7.0</div>
                                <div class="metric-label">Band</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-value" id="durationValue">00:13</div>
                                <div class="metric-label">耗时</div>
                            </div>
                        </div>
                    </div>
                    <div id="questionList"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="assets/paper_review_data.js"></script>
    <script>
        (function () {
            function getQuery(name) {
                return new URLSearchParams(window.location.search).get(name);
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            var paperId = getQuery("paperId") || "NUMK2026131629";
            var studentId = getQuery("studentId") || "STU20260601001";
            var candidateId = getQuery("candidateId") || paperId;
            var paper = window.paperReviewStore.getPaper(paperId);
            var finalKey = "paperReviewFinal:" + paperId + ":" + studentId;

            var metaRow = document.getElementById("metaRow");
            var paperTabs = document.getElementById("paperTabs");
            var totalScore = document.getElementById("totalScore");
            var durationValue = document.getElementById("durationValue");
            var questionList = document.getElementById("questionList");
            var markBtn = document.getElementById("markBtn");
            var downloadBtn = document.getElementById("downloadBtn");
            var finalReview = loadFinalReview();

            function loadFinalReview() {
                try {
                    var cached = window.localStorage.getItem(finalKey);
                    return cached ? JSON.parse(cached) : null;
                } catch (error) {
                    console.error(error);
                    return null;
                }
            }

            function renderMeta() {
                metaRow.innerHTML = [
                    "考试名称：" + paper.examName,
                    "学生姓名：" + paper.studentName,
                    "准考证号：" + candidateId
                ].map(function (item) {
                    return "<span>" + item + "</span>";
                }).join("");
            }

            function renderTabs() {
                paperTabs.innerHTML = paper.tabs.map(function (tab) {
                    return '<div class="paper-tab' + (tab === paper.activeTab ? ' active' : '') + '">' + tab + '</div>';
                }).join("");
            }

            function renderSummary() {
                totalScore.textContent = parseFloat(paper.totalScore).toFixed(1);
                durationValue.textContent = paper.duration;
            }

            function renderQuestions() {
                questionList.innerHTML = paper.questions.map(function (question) {
                    var cues = question.cuePoints.length
                        ? '<ul class="cue-list">' + question.cuePoints.map(function (item) {
                            return "<li>" + item + "</li>";
                        }).join("") + "</ul>"
                        : "";
                    var comment = finalReview && finalReview.questionMarks && finalReview.questionMarks[question.id]
                        ? finalReview.questionMarks[question.id].comment
                        : "";
                    var commentBlock = comment
                        ? [
                            '<div class="review-comment-box">',
                            '<div class="review-comment-label">评语</div>',
                            '<div class="review-comment-text">' + escapeHtml(comment) + '</div>',
                            '</div>'
                        ].join("")
                        : "";

                    return [
                        '<div class="question-card">',
                        '<div class="question-title">' + question.title + '</div>',
                        '<div class="question-prompt">' + question.prompt + '</div>',
                        cues,
                        '<div class="answer-block">',
                        '<div class="answer-label">' + question.answerLabel + '</div>',
                        '<audio class="audio-mock" controls></audio>',
                        '<div class="answer-text">' + escapeHtml(question.transcript) + '</div>',
                        commentBlock,
                        '</div>',
                        '</div>'
                    ].join("");
                }).join("");
            }

            markBtn.addEventListener("click", function () {
                var params = new URLSearchParams({
                    paperId: paper.paperId,
                    studentId: studentId,
                    candidateId: candidateId
                });
                window.location.href = "后台试卷批改.html?" + params.toString();
            });

            downloadBtn.addEventListener("click", function () {
                alert("已模拟下载当前试卷全部答题卡。");
            });

            renderMeta();
            renderTabs();
            renderSummary();
            renderQuestions();
        })();
    </script>
</body>
</html>
