<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>面试设备检测 - VISION ACADEMY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root{--blue:#2159b7;--navy:#293b59;--bg:#f4f7fb;--line:#e3e9f2;--text:#344054;--muted:#7c8aa1;--green:#21a56a}*{box-sizing:border-box}body{margin:0;min-width:1024px;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.app{display:grid;min-height:100vh;grid-template-columns:224px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line)}.sidebar-logo{display:flex;align-items:center;gap:10px;height:92px;padding:0 20px;border-bottom:1px solid var(--line);color:#0c5bd8;font-size:16px;font-weight:800;line-height:1.35}.logo-mark{display:grid;width:38px;height:38px;place-items:center;border:2px solid currentColor;border-radius:50%;font-size:17px}.sidebar-menu{padding:18px 10px}.menu-item{display:flex;align-items:center;gap:14px;height:48px;margin-bottom:7px;padding:0 16px;border-radius:8px;color:#667085;font-size:15px;font-weight:700}.menu-item.active,.menu-item:hover{background:#edf4ff;color:#1262d8}.menu-item i{width:18px;text-align:center}.header{height:64px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line)}.exam-select{height:34px;padding:0 13px;border:1px solid #d9e3ef;border-radius:18px;background:#fff;color:#43526d;font-weight:700}.user{color:#596780;font-size:14px}.logout{padding:7px 12px;border-radius:16px;background:#edf4ff;color:#1763d4;font-size:13px;font-weight:700}.content{max-width:1030px;margin:0 auto;padding:34px 42px 60px}.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:#5a6b86;font-size:14px}.title{margin:0;color:#293b59;font-size:28px}.subtitle{margin:9px 0 26px;color:var(--muted);font-size:14px}.steps{display:flex;align-items:center;margin:0 0 26px;padding:20px 28px;border:1px solid var(--line);border-radius:10px;background:#fff}.step{display:flex;align-items:center;gap:10px;color:#97a3b7;font-size:14px;font-weight:800}.step i{display:grid;width:28px;height:28px;place-items:center;border-radius:50%;background:#eef2f7;font-style:normal}.step.active{color:var(--blue)}.step.active i{background:var(--blue);color:#fff}.step-line{flex:1;height:1px;margin:0 20px;background:#dfe6ef}.check-card{padding:26px 30px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 5px 16px rgba(41,59,89,.04)}.check-card h2{margin:0 0 7px;font-size:20px}.check-card>p{margin:0 0 22px;color:var(--muted);font-size:14px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.check{padding:20px;border:1px solid #e1e8f1;border-radius:10px;background:#fbfcfe}.check-icon{display:grid;width:42px;height:42px;place-items:center;margin-bottom:14px;border-radius:10px;background:#edf4ff;color:#3978d9;font-size:20px}.check h3{margin:0 0 8px;font-size:16px}.check p{min-height:38px;margin:0;color:#7d8ba2;font-size:13px;line-height:1.55}.status{display:inline-flex;align-items:center;gap:5px;margin-top:14px;color:#8d99ab;font-size:13px;font-weight:700}.check.passed{border-color:#c8ead9;background:#f8fffb}.check.passed .check-icon{background:#e5f8ec;color:var(--green)}.check.passed .status{color:var(--green)}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.outline,.primary{height:40px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:800}.outline{border:1px solid #cbd7e8;background:#fff;color:#536a90}.primary{border:0;background:#293b59;color:#fff}.primary:disabled{background:#aeb9cb;cursor:not-allowed}.note{margin-top:18px;padding:14px 16px;border-left:3px solid #68a0ed;border-radius:7px;background:#f6f9fe;color:#687792;font-size:13px;line-height:1.7}@media(max-width:1100px){.content{padding:28px}.checks{grid-template-columns:1fr}}
    </style>
</head>
<body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-mark">A</div><div>VISION ACADEMY<br>唯寻国际教育</div></div><nav class="sidebar-menu"><a class="menu-item active" href="牛剑模拟面试首页.html"><i class="fa fa-home"></i><span>考试首页</span></a><a class="menu-item" href="牛剑模拟面试考试记录.html"><i class="fa fa-file-text-o"></i><span>考试记录</span></a><a class="menu-item" href="考试入口.html"><i class="fa fa-th-large"></i><span>考试类型</span></a><a class="menu-item" href="#"><i class="fa fa-user-o"></i><span>个人中心</span></a></nav></aside><main><header class="header"><select class="exam-select"><option>牛剑模拟面试</option></select><span class="user">Hi，王一博</span><a class="logout" id="logoutBtn" href="index.html"><i class="fa fa-user-circle-o"></i> 退出登录</a></header><div class="content"><a class="back" href="牛剑模拟面试首页.html"><i class="fa fa-angle-left"></i> 返回考场选择</a><h1 class="title">考前设备检测</h1><p class="subtitle" id="sessionText">正在检查本次模拟面试所需的设备状态。</p><div class="steps"><div class="step active"><i>1</i>设备检测</div><div class="step-line"></div><div class="step"><i>2</i>考前确认</div><div class="step-line"></div><div class="step"><i>3</i>正式面试</div></div><section class="check-card"><h2>请完成设备检测</h2><p>检测结果仅用于本次静态原型演示，不会调用本机摄像头或麦克风。</p><div class="checks" id="checks"><article class="check"><div class="check-icon"><i class="fa fa-wifi"></i></div><h3>网络连接</h3><p>建议使用稳定网络，避免面试过程中断线。</p><span class="status"><i class="fa fa-circle-o"></i> 等待检测</span></article><article class="check"><div class="check-icon"><i class="fa fa-video-camera"></i></div><h3>摄像头</h3><p>正式面试将使用摄像头画面进行模拟监控。</p><span class="status"><i class="fa fa-circle-o"></i> 等待检测</span></article><article class="check"><div class="check-icon"><i class="fa fa-microphone"></i></div><h3>麦克风</h3><p>请确认可清晰录制口头作答与推理过程。</p><span class="status"><i class="fa fa-circle-o"></i> 等待检测</span></article></div><div class="actions"><button class="outline" id="checkBtn" type="button"><i class="fa fa-refresh"></i> 开始检测</button><button class="primary" id="nextBtn" type="button" disabled>下一步：考前确认 <i class="fa fa-angle-right"></i></button></div></section><div class="note"><i class="fa fa-lightbulb-o"></i> 进入正式面试后，可使用白板整理思路，也可通过二维码上传纸质草稿。</div></div></main></div><script>(function(){var loginKey='examPlatformLoggedIn';if(localStorage.getItem(loginKey)!=='true'){window.location.href='index.html';return;}var setup;try{setup=JSON.parse(sessionStorage.getItem('oxbridgeInterviewSetup')||'null');}catch(e){}if(!setup){window.location.href='牛剑模拟面试首页.html';return;}document.getElementById('sessionText').textContent='本次考场：'+setup.examName+'，预计时长 '+setup.durationMinutes+' 分钟。';var checked=false;document.getElementById('checkBtn').onclick=function(){var button=this;if(checked)return;button.disabled=true;button.innerHTML='<i class="fa fa-spinner fa-spin"></i> 检测中';setTimeout(function(){document.querySelectorAll('.check').forEach(function(card){card.classList.add('passed');card.querySelector('.status').innerHTML='<i class="fa fa-check-circle"></i> 检测通过';});checked=true;button.innerHTML='<i class="fa fa-check"></i> 检测完成';document.getElementById('nextBtn').disabled=false;},650);};document.getElementById('nextBtn').onclick=function(){sessionStorage.setItem('oxbridgeInterviewDeviceChecked','true');window.location.href='牛剑模拟面试考前确认.html';};document.getElementById('logoutBtn').onclick=function(e){e.preventDefault();localStorage.removeItem(loginKey);localStorage.removeItem('examPlatformUserName');window.location.href='index.html';};})();</script></body>
<script>
    document.querySelectorAll('.menu-item[href="考试入口.html"]').forEach(function(item) { item.remove(); });
    if (localStorage.getItem('examPlatformLoggedIn') === 'true' && sessionStorage.getItem('oxbridgeInterviewSetup')) {
        window.location.replace('考前确认.html?flow=interview');
    }
</script>
</html>
