<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>面试考前确认 - VISION ACADEMY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        :root{--blue:#2159b7;--navy:#293b59;--bg:#f4f7fb;--line:#e3e9f2;--text:#344054;--muted:#7c8aa1;--green:#21a56a}*{box-sizing:border-box}body{margin:0;min-width:1024px;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.app{display:grid;min-height:100vh;grid-template-columns:224px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line)}.sidebar-logo{display:flex;align-items:center;gap:10px;height:92px;padding:0 20px;border-bottom:1px solid var(--line);color:#0c5bd8;font-size:16px;font-weight:800;line-height:1.35}.logo-mark{display:grid;width:38px;height:38px;place-items:center;border:2px solid currentColor;border-radius:50%;font-size:17px}.sidebar-menu{padding:18px 10px}.menu-item{display:flex;align-items:center;gap:14px;height:48px;margin-bottom:7px;padding:0 16px;border-radius:8px;color:#667085;font-size:15px;font-weight:700}.menu-item.active,.menu-item:hover{background:#edf4ff;color:#1262d8}.menu-item i{width:18px;text-align:center}.header{height:64px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line)}.exam-select{height:34px;padding:0 13px;border:1px solid #d9e3ef;border-radius:18px;background:#fff;color:#43526d;font-weight:700}.user{color:#596780;font-size:14px}.logout{padding:7px 12px;border-radius:16px;background:#edf4ff;color:#1763d4;font-size:13px;font-weight:700}.content{max-width:920px;margin:0 auto;padding:34px 42px 60px}.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:#5a6b86;font-size:14px}.title{margin:0;color:#293b59;font-size:28px}.subtitle{margin:9px 0 26px;color:var(--muted);font-size:14px}.steps{display:flex;align-items:center;margin:0 0 26px;padding:20px 28px;border:1px solid var(--line);border-radius:10px;background:#fff}.step{display:flex;align-items:center;gap:10px;color:#97a3b7;font-size:14px;font-weight:800}.step i{display:grid;width:28px;height:28px;place-items:center;border-radius:50%;background:#eef2f7;font-style:normal}.step.done{color:var(--green)}.step.done i{background:#e5f8ec;color:var(--green)}.step.active{color:var(--blue)}.step.active i{background:var(--blue);color:#fff}.step-line{flex:1;height:1px;margin:0 20px;background:#dfe6ef}.card{padding:28px 30px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 5px 16px rgba(41,59,89,.04)}.card h2{margin:0 0 20px;font-size:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e6ebf2;border-radius:9px;overflow:hidden}.detail{display:flex;gap:13px;padding:17px;border-right:1px solid #e6ebf2;border-bottom:1px solid #e6ebf2}.detail:nth-child(2n){border-right:0}.detail:nth-last-child(-n+2){border-bottom:0}.detail i{width:20px;padding-top:2px;color:#5c91de}.detail-label{margin-bottom:4px;color:#8b98aa;font-size:12px}.detail-value{color:#344054;font-size:14px;font-weight:800}.notice{margin-top:25px;padding:20px;border-radius:9px;background:#f7f9fc}.notice h3{margin:0 0 10px;color:#344b71;font-size:16px}.notice ul{margin:0;padding-left:20px;color:#687792;font-size:13px;line-height:1.9}.agree{display:flex;align-items:flex-start;gap:9px;margin-top:22px;color:#52627c;font-size:13px;line-height:1.65}.agree input{margin-top:4px;accent-color:#2159b7}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:23px}.outline,.primary{height:42px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:800}.outline{border:1px solid #cbd7e8;background:#fff;color:#536a90}.primary{border:0;background:#293b59;color:#fff}.primary:disabled{background:#aeb9cb;cursor:not-allowed}@media(max-width:1100px){.content{padding:28px}.details{grid-template-columns:1fr}.detail,.detail:nth-child(2n),.detail:nth-last-child(-n+2){border-right:0;border-bottom:1px solid #e6ebf2}.detail:last-child{border-bottom:0}}
    </style>
</head>
<body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-mark">A</div><div>VISION ACADEMY<br>唯寻国际教育</div></div><nav class="sidebar-menu"><a class="menu-item active" href="牛剑模拟面试首页.html"><i class="fa fa-home"></i><span>考试首页</span></a><a class="menu-item" href="牛剑模拟面试考试记录.html"><i class="fa fa-file-text-o"></i><span>考试记录</span></a><a class="menu-item" href="考试入口.html"><i class="fa fa-th-large"></i><span>考试类型</span></a><a class="menu-item" href="#"><i class="fa fa-user-o"></i><span>个人中心</span></a></nav></aside><main><header class="header"><select class="exam-select"><option>牛剑模拟面试</option></select><span class="user">Hi，王一博</span><a class="logout" id="logoutBtn" href="index.html"><i class="fa fa-user-circle-o"></i> 退出登录</a></header><div class="content"><a class="back" href="牛剑模拟面试设备检测.html"><i class="fa fa-angle-left"></i> 返回设备检测</a><h1 class="title">考前确认</h1><p class="subtitle">请核对本次模拟面试考场信息，确认后将进入正式面试页面。</p><div class="steps"><div class="step done"><i class="fa fa-check"></i>设备检测</div><div class="step-line"></div><div class="step active"><i>2</i>考前确认</div><div class="step-line"></div><div class="step"><i>3</i>正式面试</div></div><section class="card"><h2>本次面试信息</h2><div class="details"><div class="detail"><i class="fa fa-comments-o"></i><div><div class="detail-label">面试考场</div><div class="detail-value" id="examName"></div></div></div><div class="detail"><i class="fa fa-flag-o"></i><div><div class="detail-label">考试轮次</div><div class="detail-value" id="round"></div></div></div><div class="detail"><i class="fa fa-university"></i><div><div class="detail-label">目标院校</div><div class="detail-value" id="university"></div></div></div><div class="detail"><i class="fa fa-book"></i><div><div class="detail-label">目标专业</div><div class="detail-value" id="major"></div></div></div><div class="detail"><i class="fa fa-clock-o"></i><div><div class="detail-label">模拟时长</div><div class="detail-value" id="duration"></div></div></div><div class="detail"><i class="fa fa-video-camera"></i><div><div class="detail-label">作答方式</div><div class="detail-value">线上视频模拟面试</div></div></div></div><div class="notice"><h3>考前须知</h3><ul><li>正式面试将展示题目、录制时长、白板与题目导航，录音和监控为界面模拟状态。</li><li>请用口头表达完成推理过程；如有纸质草稿，可在考场内扫码上传对应题目。</li><li>进入考场后即可开始计时，提交后将生成面试记录及模拟分析报告。</li></ul></div><label class="agree"><input type="checkbox" id="agree"><span>我已确认考场信息，并已阅读并同意以上考前须知。</span></label><div class="actions"><a class="outline" href="牛剑模拟面试首页.html">重新选择考场</a><button class="primary" type="button" id="enterBtn" disabled>确认无误，进入模拟面试 <i class="fa fa-angle-right"></i></button></div></section></div></main></div><script>(function(){var loginKey='examPlatformLoggedIn';if(localStorage.getItem(loginKey)!=='true'){window.location.href='index.html';return;}var setup;try{setup=JSON.parse(sessionStorage.getItem('oxbridgeInterviewSetup')||'null');}catch(e){}if(!setup){window.location.href='牛剑模拟面试首页.html';return;}if(sessionStorage.getItem('oxbridgeInterviewDeviceChecked')!=='true'){window.location.href='牛剑模拟面试设备检测.html';return;}[['examName','examName'],['round','round'],['university','university'],['major','major']].forEach(function(pair){document.getElementById(pair[0]).textContent=setup[pair[1]];});document.getElementById('duration').textContent=setup.durationMinutes+' 分钟';document.getElementById('agree').onchange=function(){document.getElementById('enterBtn').disabled=!this.checked;};document.getElementById('enterBtn').onclick=function(){sessionStorage.setItem('oxbridgeInterviewConfirmed','true');window.location.href='牛剑模拟面试考试.html';};document.getElementById('logoutBtn').onclick=function(e){e.preventDefault();localStorage.removeItem(loginKey);localStorage.removeItem('examPlatformUserName');window.location.href='index.html';};})();</script></body>
<script>
    document.querySelectorAll('.menu-item[href="考试入口.html"]').forEach(function(item) { item.remove(); });
    var deviceCheckBack = document.querySelector('.back');
    if (deviceCheckBack) deviceCheckBack.href = '考前确认.html?flow=interview';
</script>
</html>
